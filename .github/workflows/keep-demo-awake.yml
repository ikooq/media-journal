# Supabase pauses free projects after a week without activity, which would take the live demo
# (media-journal-six.vercel.app) down. Every three days this signs in with the public demo account
# and reads its space: real database activity, no writes.
name: keep-demo-awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      URL: ${{ secrets.DEMO_SUPABASE_URL }}
      KEY: ${{ secrets.DEMO_SUPABASE_KEY }}
      EMAIL: ${{ secrets.DEMO_EMAIL }}
      PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - name: Sign in and read the demo space
        run: |
          body=$(jq -n --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')
          token=$(curl -fsS --retry 2 "$URL/auth/v1/token?grant_type=password" \
            -H "apikey: $KEY" -H "content-type: application/json" -d "$body" | jq -r .access_token)
          test -n "$token" && test "$token" != null
          curl -fsS --retry 2 "$URL/rest/v1/spaces?select=name" \
            -H "apikey: $KEY" -H "authorization: Bearer $token" | jq -e 'length > 0'
